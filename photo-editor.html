<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTRA Photo Editor</title>

<link rel="stylesheet" href="css/photo-editor.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="editor-container">

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>ASTRA</h2>

        </div>

        <nav>

            <button id="uploadImage">
                <i class="fa-solid fa-image"></i>
                Image
            </button>

            <button id="replaceImage">

                <i class="fa-solid fa-repeat"></i>

                Replace

            </button>
            <button id="duplicateImage">

                <i class="fa-solid fa-copy"></i>

                Duplicate

            </button>
            <button id="deleteImage">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>
            <button id="fitCanvas">
                
                <i class="fa-solid fa-expand"></i>
                Fit Canvas
            </button>
            <button id="setBackground">
                <i class="fa-solid fa-fill"></i>
                Background
            </button>

            <button id="addHeading">
                <i class="fa-solid fa-heading"></i>
                Heading
            </button>

            <button id="addParagraph">
                <i class="fa-solid fa-paragraph"></i>
                Paragraph
            </button>

            <button id="addRectangle">
                <i class="fa-regular fa-square"></i>
                Rectangle
            </button>

            <button id="addCircle">
                <i class="fa-regular fa-circle"></i>
                Circle
            </button>

            <button id="addTriangle">
                <i class="fa-solid fa-play"></i>
                Triangle
            </button>

            <button id="addLine">
                <i class="fa-solid fa-minus"></i>
                Line
            </button>

            <button id="addRoundedRect">
                <i class="fa-regular fa-square-full"></i>
                Rounded
            </button>

            <button id="addStar">
                <i class="fa-solid fa-star"></i>
                Star
            </button>

            <button id="addArrow">
                <i class="fa-solid fa-arrow-right"></i>
                Arrow
            </button>
            <button id="cropTool">

                <i class="fa-solid fa-crop"></i>

                Crop

            </button>
            <button id="filtersTool">

                <i class="fa-solid fa-sliders"></i>

                Filters

            </button>

            <button id="aiTools">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                AI Tools
            </button>

            <button id="templates">
                <i class="fa-solid fa-layer-group"></i>
                Templates
            </button>
            <button id="exportPNG">
                PNG
            </button>

            <button id="exportJPG">
                JPG
            </button>

            <button id="exportPDF">
                PDF
            </button>

            <button id="saveProject">
                Save
            </button>

            <button id="openProject">
                Open
            </button>

            <button id="printCanvas">
                Print
            </button>

            <input
            type="file"
            id="projectFile"
            accept=".astra"
            hidden>

            <hr>

<div class="pages-panel">

    <h3>Pages</h3>

    <div id="pagesList"></div>

    <button id="addPage">

        <i class="fa-solid fa-plus"></i>

        Add Page

    </button>

</div>

        </nav>

    </aside>

    <!-- MAIN -->

    <div class="main-area">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="left">

                <button id="undoBtn">

                    <i class="fa-solid fa-arrow-rotate-left"></i>

                </button>

                <button id="redoBtn">

                    <i class="fa-solid fa-arrow-rotate-right"></i>

                </button>
                <button id="clearRecovery">

                    Clear Recovery

                </button>

            </div>

            <h2>ASTRA Photo Editor</h2>

            <div class="right">

                <button id="saveBtn">

                    Save

                </button>

                <button id="exportBtn">

                    Export

                </button>

                <button id="zoomOutBtn">
                    <i class="fa-solid fa-minus"></i>
                </button>

                <span id="zoomValue">100%</span>

                <button id="zoomInBtn">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="toggleGrid">

                    Grid

                </button>
            </div>

        </header>

        <!-- CANVAS -->

        <div class="workspace">

    <div class="ruler-corner"></div>

    <div class="horizontal-ruler" id="horizontalRuler"></div>

    <div class="vertical-ruler" id="verticalRuler"></div>

    <div class="canvas-container">

        <canvas id="editorCanvas"></canvas>

    </div>

</div>

    <!-- RIGHT PANEL -->

    <aside class="properties">

        <h3>Properties</h3>

        <div id="propertyContent">
            <label>Fill</label>

            <input type="color" id="shapeFill">

            <label>Stroke</label>

            <input type="color" id="shapeStroke">

            <label>Stroke Width</label>

            <input
            type="range"
            id="shapeStrokeWidth"
            min="0"
            max="20"
            value="2">

    <label>Fill Color</label>

    <input type="color" id="fillColor" value="#4f46e5">

    <label>Stroke Color</label>

    <input type="color" id="strokeColor" value="#000000">

    <label>Stroke Width</label>

    <input
        type="range"
        id="strokeWidth"
        min="0"
        max="20"
        value="2">

    <label>Opacity</label>

    <input
        type="range"
        id="opacity"
        min="0"
        max="100"
        value="100">

    <label>Rotation</label>

    <input
        type="range"
        id="rotation"
        min="0"
        max="360"
        value="0">

        <label>Brightness</label>

<input
type="range"
id="brightness"
min="-1"
max="1"
step="0.05"
value="0">

<label>Contrast</label>

<input
type="range"
id="contrast"
min="-1"
max="1"
step="0.05"
value="0">

<label>Saturation</label>

<input
type="range"
id="saturation"
min="-1"
max="1"
step="0.05"
value="0">

<label>Blur</label>

<input
type="range"
id="blur"
min="0"
max="1"
step="0.05"
value="0">

<div class="filter-buttons">

<button id="grayBtn">

Grayscale

</button>

<button id="sepiaBtn">

Sepia

</button>

<button id="invertBtn">

Invert

</button>

<button id="resetFilters">

Reset Filters

</button>

</div>
<hr>

<h3>Text</h3>

<label>Font</label>

<select id="fontFamily">

    <option>Poppins</option>

    <option>Arial</option>

    <option>Verdana</option>

    <option>Georgia</option>

    <option>Times New Roman</option>

</select>

<label>Font Size</label>

<input
type="range"
id="fontSize"
min="12"
max="120"
value="40">

<label>Font Color</label>

<input
type="color"
id="fontColor"
value="#000000">

<div class="text-actions">

<button id="boldBtn">

B

</button>

<button id="italicBtn">

I

</button>

<button id="underlineBtn">

U

</button>

</div>

<label>Alignment</label>

<select id="textAlign">

<option value="left">Left</option>

<option value="center">Center</option>

<option value="right">Right</option>

</select>

    <button id="applyCrop">

    Apply Crop

</button>

<button id="cancelCrop">

    Cancel Crop

</button>
    
    <button id="duplicateBtn">

        Duplicate

    </button>

    <button id="deleteBtn">

        Delete

    </button>
    <hr>

<h3>Mask</h3>

<label>Mask Shape</label>

<select id="maskType">

    <option value="circle">
        Circle
    </option>

    <option value="rectangle">
        Rectangle
    </option>

    <option value="rounded">
        Rounded
    </option>

</select>

<button id="applyMask">

    Apply Mask

</button>

<button id="removeMask">

    Remove Mask

</button>

<hr>

<div class="layers-section">

    <h3>Layers</h3>

    <div id="layersList"></div>

    <div class="layer-buttons">

        <button id="layerFront">
            ⬆ Front
        </button>

        <button id="layerBack">
            ⬇ Back
        </button>

        <button id="layerDuplicate">
            📄 Duplicate
        </button>

        <button id="layerDelete">
            🗑 Delete
        </button>

    </div>

</div>

</div>
    </aside>

</div>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>



<script src="js/canvas.js"></script>

<script src="js/image.js"></script>

<script src="js/text.js"></script>

<script src="js/shapes.js"></script>

<script src="js/filters.js"></script>

<script src="js/layers.js"></script>

<script src="js/history.js"></script>

<script src="js/export.js"></script>

<script src="js/keyboard.js"></script>

<script src="js/context-menu.js"></script>

<script src="js/pages.js"></script>

<script src="js/autosave.js"></script>

<script src="js/crop.js"></script>

<script src="js/mask.js"></script>

<script src="js/smart-guides.js"></script>

<script src="js/ui.js"></script>

<script src="js/app.js"></script>


<div id="contextMenu" class="context-menu">

    <button id="ctxCopy">
        <i class="fa-solid fa-copy"></i>
        Copy
    </button>

    <button id="ctxPaste">
        <i class="fa-solid fa-paste"></i>
        Paste
    </button>

    <button id="ctxDuplicate">
        <i class="fa-solid fa-clone"></i>
        Duplicate
    </button>

    <button id="ctxDelete">
        <i class="fa-solid fa-trash"></i>
        Delete
    </button>

    <hr>

    <button id="ctxFront">
        ⬆ Bring To Front
    </button>

    <button id="ctxBack">
        ⬇ Send To Back
    </button>

</div>
</body>

</html>
